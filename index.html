<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISEET Task Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand-bar">
        <img class="logo" src="assets/iseet-logo.png" alt="ISEET — Accelerating Digital Transformation" width="172" height="52" />
      </div>
      <div class="title-block">
        <p class="eyebrow">Workplan · Task register</p>
        <h1>Tasks</h1>
        <span class="rule" aria-hidden="true"></span>
      </div>
      <dl class="stats" aria-label="Summary">
        <div class="stat"><dt>Active</dt><dd id="stat-active">0</dd></div>
        <div class="stat"><dt>Completed</dt><dd id="stat-completed">0</dd></div>
        <div class="stat stat-overdue"><dt>Overdue</dt><dd id="stat-overdue">0</dd></div>
      </dl>
      <p class="sr-only" id="summary" aria-live="polite"></p>
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <p class="eyebrow form-label">New task</p>
      <label class="sr-only" for="task-title">New task</label>
      <input id="task-title" name="title" type="text" maxlength="200" placeholder="Add a task…" required />
      <label class="sr-only" for="task-priority">Priority</label>
      <select id="task-priority" name="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <label class="sr-only" for="task-due">Due date</label>
      <input id="task-due" name="dueDate" type="date" />
      <button type="submit" class="btn-primary">Add task</button>
      <p class="form-error" id="form-error" role="alert"></p>
    </form>

    <section class="toolbar" aria-label="Filters">
      <div class="filters" role="group" aria-label="Status">
        <button type="button" data-status="all" aria-pressed="true">All</button>
        <button type="button" data-status="active" aria-pressed="false">Active</button>
        <button type="button" data-status="completed" aria-pressed="false">Completed</button>
        <button type="button" data-status="overdue" aria-pressed="false">Overdue</button>
      </div>
      <div class="toolbar-right">
        <label class="sr-only" for="search">Search</label>
        <input id="search" type="search" placeholder="Search…" />
        <label class="sr-only" for="sort">Sort by</label>
        <select id="sort">
          <option value="created">Newest</option>
          <option value="due">Due date</option>
          <option value="priority">Priority</option>
        </select>
      </div>
    </section>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks to show.</p>

    <footer class="app-footer">
      <button type="button" id="clear-completed" class="btn-link">Clear completed</button>
    </footer>
  </main>

  <template id="task-template">
    <li class="task">
      <input type="checkbox" class="task-toggle" />
      <div class="task-body">
        <span class="task-title"></span>
        <div class="task-meta">
          <span class="badge task-priority"></span>
          <span class="task-due"></span>
        </div>
      </div>
      <div class="task-actions">
        <button type="button" class="btn-icon task-edit">Edit</button>
        <button type="button" class="btn-icon task-delete">Delete</button>
      </div>
    </li>
  </template>

  <script src="src/tasks.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
